# Builds the site and publishes it to GitHub Pages on every push to main.
#
# dist/ is not committed — it is built here from source, so the repository
# stays the source and the published site is always what the source produces.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish by hand from the Actions tab without a new commit.
  workflow_dispatch:

# The permissions the Pages deployment needs, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs wait rather than cancel, so a slow build
# can never overwrite a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Asserts that Pages is enabled and set to "GitHub Actions" as its source.
      # Without this the repo can sit on the default "deploy from a branch"
      # setting, and deploy-pages then fails with a bare 404.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # Astro 7 requires Node >=22.12; 22 is the current LTS line.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Upload dist/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
